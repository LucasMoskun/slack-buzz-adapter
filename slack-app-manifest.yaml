display_information:
  name: Buzz Mirror Demo
  description: Mirrors one Slack channel into a private Buzz channel
  background_color: "#2d3139"
features:
  bot_user:
    display_name: Buzz Mirror
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - groups:history
      - groups:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
